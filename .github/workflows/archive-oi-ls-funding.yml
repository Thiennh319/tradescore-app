name: Archive OI/LS funding (multi)

on:
  schedule:
    - cron: '0 * * * *' # every hour UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive-oi-ls-near
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - check runner IP and region
        run: |
          echo "Public IP: $(curl -s https://api.ipify.org)"
          curl -s https://ipapi.co/json/ | jq '.country_name, .region, .city'

      - name: Debug - test Binance Futures endpoints directly
        run: |
          echo "== premiumIndex (funding) =="
          curl -s "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BNBUSDT"
          echo ""
          echo "== openInterestHist (OI) =="
          curl -s "https://fapi.binance.com/futures/data/openInterestHist?symbol=BNBUSDT&period=1h&limit=5"
          echo ""
          echo "== topLongShortAccountRatio =="
          curl -s "https://fapi.binance.com/futures/data/topLongShortAccountRatio?symbol=BNBUSDT&period=1h&limit=5"
          echo ""
          echo "== globalLongShortAccountRatio =="
          curl -s "https://fapi.binance.com/futures/data/globalLongShortAccountRatio?symbol=BNBUSDT&period=1h&limit=5"

      - name: Collect OI/LS/funding snapshot
        run: npx --yes tsx scripts/archive-oi-ls-funding.ts

      - name: Commit archive if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-archive/*.csv
          if git diff --staged --quiet; then
            echo "No archive changes"
            exit 0
          fi
          git commit -m "chore(archive): OI/LS hourly snapshot (NEAR/BTC/SOL/BNB)"
          git push
